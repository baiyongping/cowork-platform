# ============================================
# 际华协同办公平台 - 生产环境 Nginx 配置
# 域名: jihuadz.xin
# 版本: v3.12.0
# 配置文件位置: /etc/nginx/sites-available/jihuadz.xin
# ============================================

# 蓝绿部署后端配置
upstream jihua_backend {
    server 127.0.0.1:3000;  # 蓝环境（默认）
    # server 127.0.0.1:3003;  # 绿环境（部署时自动切换）
}

# HTTP 跳转到 HTTPS
server {
    listen 80;
    server_name jihuadz.xin www.jihuadz.xin;
    
    # 禁止直接IP访问
    if ($host !~* ^(jihuadz\.xin|www\.jihuadz\.xin)$ ) {
        return 444;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站配置
server {
    listen 443 ssl http2;
    server_name jihuadz.xin www.jihuadz.xin;
    
    # ============================================
    # SSL 证书配置
    # ============================================
    ssl_certificate /etc/nginx/ssl/jihuadz.xin.crt;
    ssl_certificate_key /etc/nginx/ssl/jihuadz.xin.key;
    
    # SSL 协议和加密套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    
    # SSL 会话缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # ============================================
    # 安全头配置
    # ============================================
    # HSTS (严格传输安全)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS 保护
    add_header X-XSS-Protection "1; mode=block" always;
    
    # CSP 内容安全策略（根据实际需求调整）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.cloudbase.net *.tencentcloudapi.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' *.cloudbase.net *.tencentcloudapi.com wss:;" always;
    
    # 推荐策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 权限策略
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # ============================================
    # 反向代理配置
    # ============================================
    location / {
        proxy_pass http://jihua_backend;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # HTTP 版本
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # 防缓存配置（部署时确保获取最新版本）
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    
    # ============================================
    # 静态资源缓存策略
    # ============================================
    # HTML文件 - 不缓存（防止部署后用户看到旧版本）
    location ~* \.(html)$ {
        proxy_pass http://jihua_backend;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        etag off;
    }
    
    # JS/CSS文件 - 短期缓存（带版本号的文件可以长期缓存）
    location ~* \.(js|css)$ {
        proxy_pass http://jihua_backend;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    
    # 图片和字体 - 长期缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
        proxy_pass http://jihua_backend;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    
    # Manifest 和服务工作线程
    location ~* \.(manifest|json|xml)$ {
        proxy_pass http://jihua_backend;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    
    # ============================================
    # Gzip 压缩配置
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    
    # ============================================
    # 特殊路由配置
    # ============================================
    # 健康检查端点（可选）
    location /health {
        proxy_pass http://jihua_backend;
        access_log off;
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问备份文件
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ============================================
    # 日志配置
    # ============================================
    access_log /var/log/nginx/jihuadz.xin.access.log combined;
    error_log /var/log/nginx/jihuadz.xin.error.log warn;
    
    # ============================================
    # 客户端配置
    # ============================================
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
}

# ============================================
# 限流配置（可选，防止DDoS攻击）
# ============================================
# 在 http 块中添加以下配置:
# limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;
# limit_req_status 429;
#
# 在 location / 中添加:
# limit_req zone=one burst=20 nodelay;
