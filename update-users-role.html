<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>更新用户角色</title>
  <script src="https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@latest/dist/index.umd.js"></script>
</head>
<body>
  <h1>更新用户角色 - 移除废弃的user角色</h1>
  <div id="result">正在处理...</div>

  <script>
    const app = tcb.init({
      env: 'jihua-oa-dev-3goht9irae4d949f'
    });

    const db = app.database();

    (async () => {
      try {
        // 查找所有role为user的用户
        const result = await db.collection('users')
          .where({ role: 'user' })
          .get();
        
        const users = result.data;
        console.log(`📊 找到 ${users.length} 个使用user角色的用户:`, users);
        
        if (users.length === 0) {
          document.getElementById('result').innerHTML = '<p>✅ 没有用户使用user角色,无需处理</p>';
          return;
        }
        
        // 逐个更新用户
        let html = `<h2>找到 ${users.length} 个用户</h2><ul>`;
        let updateCount = 0;
        
        for (const user of users) {
          try {
            await db.collection('users').doc(user._id).update({
              role: '' // 清空role字段
              // 保留roles字段不变
            });
            
            updateCount++;
            html += `<li>✅ ${user.username} (${user.name}) - roles: ${JSON.stringify(user.roles || [])}</li>`;
            console.log(`✅ 更新成功: ${user.username}`);
          } catch (error) {
            html += `<li>❌ ${user.username} (${user.name}) - 错误: ${error.message}</li>`;
            console.error(`❌ 更新失败: ${user.username}`, error);
          }
        }
        
        html += `</ul><h3>更新完成: ${updateCount}/${users.length}</h3>`;
        html += `<h3>后续操作:</h3><ol>
          <li>请管理员登录系统</li>
          <li>进入"系统设置 > 员工管理"</li>
          <li>为以上用户分配正确的角色</li>
        </ol>`;
        
        document.getElementById('result').innerHTML = html;
      } catch (error) {
        console.error('❌ 处理失败:', error);
        document.getElementById('result').innerHTML = `<p style="color:red;">❌ 处理失败: ${error.message}</p>`;
      }
    })();
  </script>
</body>
</html>
