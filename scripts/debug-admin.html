<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>调试Admin用户</title>
  <script src="https://web-9gikcbug35bad3a8-1304825656.tcloudbaseapp.com/sdk/1.7.0/cloud.js"></script>
  <style>
    body {
      font-family: 'Courier New', monospace;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background-color: #1e1e1e;
      color: #d4d4d4;
    }
    .container {
      background: #252526;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #3e3e42;
    }
    h2 {
      color: #4ec9b0;
      margin-top: 0;
    }
    button {
      background-color: #0e639c;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #1177bb;
    }
    button:disabled {
      background-color: #3e3e42;
      cursor: not-allowed;
    }
    button.success {
      background-color: #107c10;
    }
    button.success:hover {
      background-color: #0f6a0f;
    }
    button.danger {
      background-color: #e81123;
    }
    button.danger:hover {
      background-color: #c50f1f;
    }
    pre {
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      border: 1px solid #3e3e42;
      font-size: 13px;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      background: #2d2d30;
      border-radius: 4px;
      border-left: 3px solid #0e639c;
    }
    .success-msg {
      color: #4ec9b0;
      font-weight: bold;
    }
    .error-msg {
      color: #f48771;
      font-weight: bold;
    }
    .warning-msg {
      color: #dcdcaa;
      font-weight: bold;
    }
    .input-group {
      margin: 15px 0;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      color: #9cdcfe;
    }
    .input-group input {
      width: 300px;
      padding: 8px;
      background: #3c3c3c;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      color: #d4d4d4;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔍 Admin用户调试工具</h2>
    
    <div class="section">
      <h3>步骤1: 查询Admin用户数据</h3>
      <button id="queryBtn" onclick="queryAdminUser()">查询Admin用户</button>
      <div id="queryResult"></div>
    </div>

    <div class="section">
      <h3>步骤2: 测试密码加密</h3>
      <div class="input-group">
        <label>测试密码:</label>
        <input type="text" id="testPassword" value="admin123" />
      </div>
      <button onclick="testPasswordHash()">生成密码哈希</button>
      <div id="hashResult"></div>
    </div>

    <div class="section">
      <h3>步骤3: 修复Admin用户</h3>
      <button class="success" id="fixBtn" onclick="fixAdminUser()" disabled>修复Admin用户数据</button>
      <div id="fixResult"></div>
    </div>

    <div class="section">
      <h3>步骤4: 测试登录</h3>
      <div class="input-group">
        <label>用户名:</label>
        <input type="text" id="loginUsername" value="admin" />
      </div>
      <div class="input-group">
        <label>密码:</label>
        <input type="password" id="loginPassword" value="admin123" />
      </div>
      <button class="success" onclick="testLogin()">测试登录</button>
      <div id="loginResult"></div>
    </div>
  </div>

  <script>
    let cloud = null;
    let adminUser = null;
    const SECRET_KEY = 'jihua-oa-platform-secret-key-2025';

    async function hashPassword(password) {
      const msgBuffer = new TextEncoder().encode(password + SECRET_KEY);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function init() {
      if (cloud) return; // 已初始化
      
      try {
        // 确保CloudBase SDK已加载
        if (!window.cloud) {
          throw new Error('CloudBase SDK未加载，请刷新页面重试');
        }

        cloud = new window.cloud.Cloud({
          identityless: true,
          resourceAppid: 'jihua-oa-dev-3goht9irae4d949f',
          resourceEnv: 'jihua-oa-dev-3goht9irae4d949f'
        });

        await cloud.init();
        await cloud.auth().anonymousAuthProvider().signIn();
        console.log('✓ CloudBase初始化成功');
      } catch (error) {
        console.error('初始化失败:', error);
        throw error;
      }
    }

    async function queryAdminUser() {
      const btn = document.getElementById('queryBtn');
      const resultDiv = document.getElementById('queryResult');
      
      btn.disabled = true;
      btn.textContent = '查询中...';
      resultDiv.innerHTML = '';

      try {
        await init();
        const db = cloud.database();
        
        const result = await db.collection('users')
          .where({ username: 'admin' })
          .get();

        if (result.data.length === 0) {
          resultDiv.innerHTML = '<p class="error-msg">❌ 未找到admin用户</p>';
          adminUser = null;
        } else {
          adminUser = result.data[0];
          
          const issues = [];
          if (adminUser.approvalStatus !== 'approved') {
            issues.push(`❌ approvalStatus = "${adminUser.approvalStatus}" (应该是 "approved")`);
          }
          if (!adminUser.isActive) {
            issues.push(`❌ isActive = ${adminUser.isActive} (应该是 true)`);
          }
          if (adminUser.status !== '在职') {
            issues.push(`❌ status = "${adminUser.status}" (应该是 "在职")`);
          }

          resultDiv.innerHTML = `
            <p class="success-msg">✓ 找到admin用户</p>
            <pre>${JSON.stringify({
              _id: adminUser._id,
              username: adminUser.username,
              name: adminUser.name,
              approvalStatus: adminUser.approvalStatus,
              isActive: adminUser.isActive,
              status: adminUser.status,
              phone: adminUser.phone,
              email: adminUser.email,
              createdAt: adminUser.createdAt,
              password_hash_preview: adminUser.password ? adminUser.password.substring(0, 20) + '...' : 'null'
            }, null, 2)}</pre>
            ${issues.length > 0 ? `
              <p class="warning-msg">⚠️ 发现问题：</p>
              <pre>${issues.join('\n')}</pre>
            ` : '<p class="success-msg">✓ 所有字段正常</p>'}
          `;

          if (issues.length > 0) {
            document.getElementById('fixBtn').disabled = false;
          }
        }

        btn.textContent = '✓ 查询完成';
        btn.disabled = false;

      } catch (error) {
        console.error('查询失败:', error);
        resultDiv.innerHTML = `<p class="error-msg">❌ 查询失败: ${error.message}</p>`;
        btn.disabled = false;
        btn.textContent = '重试';
      }
    }

    async function testPasswordHash() {
      const password = document.getElementById('testPassword').value;
      const resultDiv = document.getElementById('hashResult');
      
      if (!password) {
        resultDiv.innerHTML = '<p class="error-msg">请输入密码</p>';
        return;
      }

      try {
        const hash = await hashPassword(password);
        
        let comparison = '';
        if (adminUser && adminUser.password) {
          const match = hash === adminUser.password;
          comparison = `
            <p class="warning-msg">与数据库对比：</p>
            <pre>数据库中的哈希: ${adminUser.password}
生成的哈希值:   ${hash}
匹配结果: ${match ? '<span class="success-msg">✓ 匹配</span>' : '<span class="error-msg">✗ 不匹配</span>'}</pre>
          `;
        }

        resultDiv.innerHTML = `
          <p class="success-msg">✓ 密码哈希生成成功</p>
          <pre>输入密码: ${password}
使用密钥: ${SECRET_KEY}
哈希值: ${hash}</pre>
          ${comparison}
        `;

      } catch (error) {
        console.error('哈希失败:', error);
        resultDiv.innerHTML = `<p class="error-msg">❌ 生成失败: ${error.message}</p>`;
      }
    }

    async function fixAdminUser() {
      const btn = document.getElementById('fixBtn');
      const resultDiv = document.getElementById('fixResult');
      
      if (!adminUser) {
        resultDiv.innerHTML = '<p class="error-msg">请先查询admin用户</p>';
        return;
      }

      btn.disabled = true;
      btn.textContent = '修复中...';
      resultDiv.innerHTML = '';

      try {
        await init();
        const db = cloud.database();
        
        const passwordHash = await hashPassword('admin123');
        const now = new Date();

        await db.collection('users')
          .doc(adminUser._id)
          .update({
            password: passwordHash,
            approvalStatus: 'approved',
            isActive: true,
            status: '在职',
            approvedBy: 'system',
            approvedAt: now,
            rejectReason: null,
            updatedAt: now
          });

        resultDiv.innerHTML = `
          <p class="success-msg">✓ Admin用户修复成功！</p>
          <pre>更新字段:
- password: 重置为 admin123 (已加密)
- approvalStatus: approved
- isActive: true
- status: 在职
- approvedBy: system
- approvedAt: ${now.toISOString()}</pre>
          <p class="success-msg">现在可以进行登录测试了</p>
        `;

        btn.textContent = '✓ 修复完成';

      } catch (error) {
        console.error('修复失败:', error);
        resultDiv.innerHTML = `<p class="error-msg">❌ 修复失败: ${error.message}</p>`;
        btn.disabled = false;
        btn.textContent = '重试';
      }
    }

    async function testLogin() {
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      const resultDiv = document.getElementById('loginResult');
      
      if (!username || !password) {
        resultDiv.innerHTML = '<p class="error-msg">请输入用户名和密码</p>';
        return;
      }

      resultDiv.innerHTML = '<p>登录测试中...</p>';

      try {
        await init();
        const db = cloud.database();

        // 1. 查询用户
        const userResult = await db.collection('users').where({ username }).get();
        
        if (userResult.data.length === 0) {
          resultDiv.innerHTML = '<p class="error-msg">❌ 用户不存在</p>';
          return;
        }

        const user = userResult.data[0];
        let steps = [`<p class="success-msg">✓ 步骤1: 找到用户 ${username}</p>`];

        // 2. 检查isActive
        if (!user.isActive) {
          steps.push('<p class="error-msg">✗ 步骤2: 账号已被禁用</p>');
          resultDiv.innerHTML = steps.join('');
          return;
        }
        steps.push('<p class="success-msg">✓ 步骤2: 账号已激活</p>');

        // 3. 检查approvalStatus
        if (user.approvalStatus === 'pending') {
          steps.push('<p class="error-msg">✗ 步骤3: 账号正在审核中</p>');
          resultDiv.innerHTML = steps.join('');
          return;
        }
        if (user.approvalStatus === 'rejected') {
          steps.push(`<p class="error-msg">✗ 步骤3: 账号审核未通过 (${user.rejectReason || '无原因'})</p>`);
          resultDiv.innerHTML = steps.join('');
          return;
        }
        if (user.approvalStatus !== 'approved') {
          steps.push(`<p class="error-msg">✗ 步骤3: 账号状态异常 (approvalStatus = "${user.approvalStatus}")</p>`);
          resultDiv.innerHTML = steps.join('');
          return;
        }
        steps.push('<p class="success-msg">✓ 步骤3: 审核状态正常 (approved)</p>');

        // 4. 验证密码
        const hashedInputPassword = await hashPassword(password);
        if (hashedInputPassword !== user.password) {
          steps.push('<p class="error-msg">✗ 步骤4: 密码错误</p>');
          steps.push(`<pre>输入密码哈希: ${hashedInputPassword}
数据库密码哈希: ${user.password}</pre>`);
          resultDiv.innerHTML = steps.join('');
          return;
        }
        steps.push('<p class="success-msg">✓ 步骤4: 密码验证通过</p>');

        // 5. 登录成功
        steps.push(`
          <p class="success-msg">🎉 登录测试成功！</p>
          <pre>用户信息:
- ID: ${user._id}
- 用户名: ${user.username}
- 姓名: ${user.name}
- 角色: ${user.role}
- 部门: ${user.department || '无'}</pre>
        `);

        resultDiv.innerHTML = steps.join('');

      } catch (error) {
        console.error('登录测试失败:', error);
        resultDiv.innerHTML = `<p class="error-msg">❌ 登录测试失败: ${error.message}</p>`;
      }
    }

    // 页面加载时等待SDK加载完成
    window.onload = function() {
      // 给SDK加载预留时间
      setTimeout(async () => {
        try {
          await init();
          console.log('✓ 页面初始化完成');
        } catch (error) {
          console.error('页面初始化失败:', error);
          alert('CloudBase SDK初始化失败，请刷新页面重试');
        }
      }, 500);
    };
  </script>
</body>
</html>
