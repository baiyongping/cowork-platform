<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试密码哈希</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .result {
      background: #2d2d2d;
      padding: 20px;
      border-radius: 8px;
      margin: 10px 0;
      border-left: 4px solid #4ade80;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px 0;
    }
    button:hover {
      background: #1d4ed8;
    }
    pre {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>🔐 密码哈希测试</h1>
  <button onclick="testHash()">测试密码哈希</button>
  <div id="output"></div>

  <script>
    const SECRET_KEY = 'jihua-oa-platform-secret-key-2025';

    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password + SECRET_KEY);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function testHash() {
      const output = document.getElementById('output');
      output.innerHTML = '<p>⏳ 正在生成密码哈希...</p>';

      try {
        const password = 'admin123';
        const hash = await hashPassword(password);
        
        output.innerHTML = `
          <div class="result">
            <h3>✅ 密码哈希生成成功</h3>
            <p><strong>原始密码:</strong> ${password}</p>
            <p><strong>SECRET_KEY:</strong> ${SECRET_KEY}</p>
            <p><strong>哈希结果:</strong></p>
            <pre>${hash}</pre>
            <p><strong>哈希长度:</strong> ${hash.length} 字符</p>
            
            <h3>📋 用于数据库的完整用户对象:</h3>
            <pre>${JSON.stringify({
              username: 'admin',
              password: hash,
              email: 'admin@jihua.com',
              name: '系统管理员',
              department: '管理部',
              role: 'admin',
              isActive: true,
              createdAt: new Date().toISOString(),
              lastLoginAt: null
            }, null, 2)}</pre>
          </div>
        `;
      } catch (error) {
        output.innerHTML = `
          <div class="result" style="border-left-color: #ef4444;">
            <h3>❌ 生成失败</h3>
            <p><strong>错误:</strong> ${error.message}</p>
            <pre>${error.stack}</pre>
          </div>
        `;
      }
    }

    // 自动执行测试
    window.addEventListener('load', testHash);
  </script>
</body>
</html>
