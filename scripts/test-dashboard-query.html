<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试Dashboard查询逻辑</title>
  <script src="https://web-9gikcbug35bad3a8-1259257161.tcloudbaseapp.com/sdk/1.7.0/cloud.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .result { margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 5px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
  </style>
</head>
<body>
  <h1>📊 测试Dashboard查询逻辑</h1>
  
  <div>
    <button onclick="testMonthlyTasks()">测试本月任务查询</button>
    <button onclick="testOpportunities()">测试跟进商机查询</button>
    <button onclick="testProjects()">测试进行中项目查询</button>
    <button onclick="testSalesGoal()">测试订单承揽查询</button>
  </div>
  
  <div id="output"></div>
  
  <script>
    // 初始化CloudBase
    const app = tcb.init({
      env: 'jihua-oa-dev-3goht9irae4d949f'
    });
    
    const db = app.database();
    const _ = db.command;
    
    function log(message, type = 'info') {
      const output = document.getElementById('output');
      const div = document.createElement('div');
      div.className = `result ${type}`;
      div.innerHTML = message;
      output.appendChild(div);
    }
    
    async function testMonthlyTasks() {
      log('🔍 开始测试本月任务查询...', 'info');
      
      try {
        // 计算日期范围
        const currentYear = 2025;
        const currentMonth = new Date().getMonth(); // 0-11
        const startOfMonthStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-01`;
        const endOfMonthStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-31`;
        
        log(`📅 查询日期范围: ${startOfMonthStr} ~ ${endOfMonthStr}`, 'info');
        
        // 查询进行中任务
        const inProgressResult = await db.collection('tasks').where({
          isDeleted: _.neq(true),
          endDate: _.gte(startOfMonthStr).and(_.lte(endOfMonthStr)),
          status: _.in(['进行中', '未开始', '暂停', '延期'])
        }).get();
        
        // 查询已完成任务
        const completedResult = await db.collection('tasks').where({
          isDeleted: _.neq(true),
          endDate: _.gte(startOfMonthStr).and(_.lte(endOfMonthStr)),
          status: '已完成'
        }).get();
        
        const inProgressTasks = inProgressResult.data || [];
        const completedTasks = completedResult.data || [];
        const totalTasks = inProgressTasks.length + completedTasks.length;
        const completionRate = totalTasks > 0 ? Math.round((completedTasks.length / totalTasks) * 100) : 0;
        
        log(`
          <h3>✅ 本月任务统计</h3>
          <p><strong>进行中任务：</strong>${inProgressTasks.length}条</p>
          <p><strong>已完成任务：</strong>${completedTasks.length}条</p>
          <p><strong>本月任务总数：</strong>${totalTasks}条</p>
          <p><strong>完成率：</strong>${completionRate}%</p>
          
          <h4>进行中任务明细：</h4>
          <table>
            <tr><th>任务名称</th><th>状态</th><th>截止日期</th><th>进度</th></tr>
            ${inProgressTasks.map(t => `
              <tr>
                <td>${t.name}</td>
                <td>${t.status}</td>
                <td>${t.endDate}</td>
                <td>${t.progress}%</td>
              </tr>
            `).join('')}
          </table>
          
          <h4>已完成任务明细：</h4>
          <table>
            <tr><th>任务名称</th><th>状态</th><th>截止日期</th><th>进度</th></tr>
            ${completedTasks.map(t => `
              <tr>
                <td>${t.name}</td>
                <td>${t.status}</td>
                <td>${t.endDate}</td>
                <td>${t.progress}%</td>
              </tr>
            `).join('')}
          </table>
        `, 'success');
        
      } catch (error) {
        log(`❌ 查询失败: ${error.message}`, 'error');
      }
    }
    
    async function testOpportunities() {
      log('🔍 开始测试跟进商机查询...', 'info');
      
      try {
        const result = await db.collection('opportunities').where({
          stage: _.in(['跟进线索', '方案咨询', '商务谈判'])
        }).get();
        
        const opportunities = result.data || [];
        const totalAmount = opportunities.reduce((sum, o) => sum + (o.estimatedAmount || 0), 0);
        
        log(`
          <h3>✅ 跟进商机统计</h3>
          <p><strong>商机数量：</strong>${opportunities.length}个</p>
          <p><strong>预期金额总和：</strong>${(totalAmount / 100000000).toFixed(2)}亿元</p>
          
          <h4>商机明细：</h4>
          <table>
            <tr><th>商机名称</th><th>客户</th><th>阶段</th><th>预期金额</th><th>概率</th></tr>
            ${opportunities.map(o => `
              <tr>
                <td>${o.name}</td>
                <td>${o.customer}</td>
                <td>${o.stage}</td>
                <td>${((o.estimatedAmount || 0) / 100000000).toFixed(2)}亿</td>
                <td>${o.probability}%</td>
              </tr>
            `).join('')}
          </table>
        `, 'success');
        
      } catch (error) {
        log(`❌ 查询失败: ${error.message}`, 'error');
      }
    }
    
    async function testProjects() {
      log('🔍 开始测试进行中项目查询...', 'info');
      
      try {
        const result = await db.collection('projects').where({
          phase: _.in(['准备期', '生产期', '交付期'])
        }).get();
        
        const projects = result.data || [];
        
        log(`
          <h3>✅ 进行中项目统计</h3>
          <p><strong>项目数量：</strong>${projects.length}个</p>
          
          ${projects.length > 0 ? `
            <h4>项目明细：</h4>
            <table>
              <tr><th>项目名称</th><th>客户</th><th>阶段</th><th>合同金额</th></tr>
              ${projects.map(p => `
                <tr>
                  <td>${p.name}</td>
                  <td>${p.customer}</td>
                  <td>${p.phase}</td>
                  <td>${((p.contractAmount || 0) / 10000).toFixed(2)}万</td>
                </tr>
              `).join('')}
            </table>
          ` : '<p>暂无进行中的项目</p>'}
        `, projects.length > 0 ? 'success' : 'info');
        
      } catch (error) {
        log(`❌ 查询失败: ${error.message}`, 'error');
      }
    }
    
    async function testSalesGoal() {
      log('🔍 开始测试订单承揽查询...', 'info');
      
      try {
        const result = await db.collection('sales_goals').where({
          type: 'annual',
          year: 2025
        }).get();
        
        const salesGoal = result.data[0];
        
        if (salesGoal) {
          const completionRate = salesGoal.orderTarget > 0 
            ? Math.round((salesGoal.orderActual / salesGoal.orderTarget) * 100) 
            : 0;
          
          log(`
            <h3>✅ 订单承揽统计</h3>
            <p><strong>年度目标：</strong>${salesGoal.orderTarget}万元</p>
            <p><strong>已完成：</strong>${salesGoal.orderActual}万元</p>
            <p><strong>完成率：</strong>${completionRate}%</p>
            <p><strong>收入目标：</strong>${salesGoal.revenueTarget}万元</p>
            <p><strong>收入实际：</strong>${salesGoal.revenueActual}万元</p>
          `, 'success');
        } else {
          log('⚠️ 暂无年度目标数据', 'info');
        }
        
      } catch (error) {
        log(`❌ 查询失败: ${error.message}`, 'error');
      }
    }
  </script>
</body>
</html>
