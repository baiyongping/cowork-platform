    function log(message, type = 'info') {
      const line = document.createElement('div');
      line.className = `log-line ${type}`;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logContainer.appendChild(line);
      logContainer.scrollTop = logContainer.scrollHeight;
      console.log(message);
    }
    
    function confirmRestore() {
      const confirmed = confirm('⚠️ 确认要恢复所有模块配置数据吗？\n\n此操作将覆盖当前数据库中的所有模块配置。');
      if (confirmed) {
        restoreAllModules();
      }
    }
    
    async function restoreAllModules() {
      restoreBtn.disabled = true;
      logContainer.innerHTML = '';
      summaryDiv.style.display = 'none';
      
      log('🔧 开始恢复模块配置数据', 'info');
      log('═'.repeat(60), 'info');
      
      try {
        let successCount = 0;
        let errorCount = 0;
        
        for (const moduleData of MODULES_DATA) {
          try {
            // 使用 doc().set() 完整替换文档
            await db.collection('modulesConfig')
              .doc(moduleData._id)
              .set({
                ...moduleData,
                updatedAt: db.serverDate(),
                restoredAt: db.serverDate()
              });
            
            log(`✅ 恢复成功: ${moduleData._id} (${moduleData.name})`, 'success');
            successCount++;
            
          } catch (error) {
            log(`❌ 恢复失败: ${moduleData._id} - ${error.message}`, 'error');
            errorCount++;
          }
        }
        
        log('═'.repeat(60), 'info');
        log('📊 恢复统计：', 'info');
        log(`   成功: ${successCount} 个模块`, successCount > 0 ? 'success' : 'info');
        log(`   失败: ${errorCount} 个模块`, errorCount > 0 ? 'error' : 'info');
        log(`   总计: ${MODULES_DATA.length} 个模块`, 'info');
        
        // 显示统计摘要
        summaryContent.innerHTML = `
          <span class="summary-item">✅ 成功: <strong>${successCount}</strong></span>
          <span class="summary-item">❌ 失败: <strong>${errorCount}</strong></span>
          <span class="summary-item">📦 总计: <strong>${MODULES_DATA.length}</strong></span>
        `;
        summaryDiv.style.display = 'block';
        
        if (errorCount === 0) {
          log('✅ 所有模块配置恢复完成！', 'success');
          log('', 'info');
          log('📌 下一步：', 'info');
          log('   1. 刷新功能模块管理页面', 'info');
          log('   2. 检查所有模块是否显示正常', 'info');
          log('   3. 点击模块查看详情', 'info');
          log('   4. 验证元数据信息是否正确', 'info');
        } else {
          log('⚠️  部分模块恢复失败，请检查错误信息', 'warning-text');
        }
        
      } catch (error) {
        log(`❌ 恢复失败: ${error.message}`, 'error');
      } finally {
        restoreBtn.disabled = false;
      }
