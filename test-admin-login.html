<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin 登录测试 - 生产环境</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
      text-align: center;
    }
    
    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .info {
      background: #e3f2fd;
      border: 1px solid #2196f3;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 30px;
    }
    
    .info h3 {
      color: #1976d2;
      font-size: 16px;
      margin-bottom: 10px;
    }
    
    .info p {
      color: #0d47a1;
      font-size: 14px;
      line-height: 1.6;
      margin: 5px 0;
    }
    
    .info strong {
      font-weight: 600;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      color: #555;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
    }
    
    .success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    
    .error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    
    .debug {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    
    .debug h4 {
      margin-bottom: 10px;
      font-size: 14px;
    }
    
    .debug pre {
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Admin 登录测试</h1>
    <p class="subtitle">生产环境 (cowork-9gg9oocb516be5fb)</p>
    
    <div class="info">
      <h3>📌 测试说明</h3>
      <p><strong>环境:</strong> 生产环境</p>
      <p><strong>用户名:</strong> admin</p>
      <p><strong>密码:</strong> 请输入正确的 admin 密码</p>
      <p><strong>目的:</strong> 验证 admin 用户是否可以正常登录</p>
    </div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input 
          type="text" 
          id="username" 
          value="admin" 
          required 
          readonly
          style="background: #f5f5f5;"
        >
      </div>
      
      <div class="form-group">
        <label for="password">密码</label>
        <input 
          type="password" 
          id="password" 
          placeholder="请输入 admin 密码" 
          required
        >
      </div>
      
      <button type="submit" id="loginButton">
        登录测试
      </button>
    </form>
    
    <div id="result"></div>
    <div id="debug" class="debug" style="display: none;"></div>
  </div>
  
  <!-- 加载 CloudBase SDK -->
  <script src="https://web.sdk.qcloud.com/tcb/latest/tcb.js"></script>
  <script>
    let app = null;
    
    // 初始化页面
    window.addEventListener('load', function() {
      console.log('✅ 页面加载完成');
      
      // 检查 CloudBase SDK
      if (typeof cloudbase === 'undefined') {
        showError('CloudBase SDK 加载失败，请检查网络连接');
        return;
      }
      
      console.log('✅ CloudBase SDK 已加载');
      
      // 初始化 CloudBase
      try {
        app = cloudbase.init({
          env: 'cowork-9gg9oocb516be5fb' // 生产环境
        });
        console.log('✅ CloudBase 已初始化');
      } catch (error) {
        console.error('❌ CloudBase 初始化失败:', error);
        showError('CloudBase 初始化失败: ' + error.message);
      }
    });
    
    // 登录测试函数
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const loginButton = document.getElementById('loginButton');
      const resultDiv = document.getElementById('result');
      const debugDiv = document.getElementById('debug');
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      if (!password) {
        showError('请输入密码');
        return;
      }
      
      loginButton.disabled = true;
      loginButton.textContent = '登录中...';
      resultDiv.innerHTML = '<p style="color: #666;">正在验证登录...</p>';
      debugDiv.style.display = 'none';
      
      let debugInfo = [];
      
      try {
        console.log('🔐 开始登录测试...');
        debugInfo.push('[1] 开始登录测试');
        debugInfo.push('  用户名: ' + username);
        debugInfo.push('  密码长度: ' + password.length);
        
        // 调用 auth 云函数
        console.log('📤 调用 auth 云函数...');
        debugInfo.push('[2] 调用 auth 云函数');
        
        const result = await app.callFunction({
          name: 'auth',
          data: {
            action: 'login',
            username: username,
            password: password
          }
        });
        
        console.log('📥 云函数返回:', result);
        debugInfo.push('[3] 云函数返回:');
        debugInfo.push(JSON.stringify(result, null, 2));
        
        const { code, message, data } = result.result;
        
        if (code === 200 && data && data.user && data.token) {
          // 登录成功
          console.log('✅ 登录成功!');
          showSuccess(
            '<h3 style="margin: 0 0 10px 0;">✅ 登录成功！</h3>' +
            '<p><strong>用户名:</strong> ' + data.user.username + '</p>' +
            '<p><strong>姓名:</strong> ' + data.user.name + '</p>' +
            '<p><strong>邮箱:</strong> ' + data.user.email + '</p>' +
            '<p><strong>角色:</strong> ' + data.user.role + '</p>' +
            '<p><strong>Token:</strong> ' + data.token.substring(0, 50) + '...</p>' +
            '<p style="margin-top: 15px; color: #155724; background: #d4edda; padding: 10px; border-radius: 5px;">' +
            '✅ <strong>Admin 用户可以正常登录！</strong><br>' +
            '问题可能出在前端页面，而不是后端认证。' +
            '</p>'
          );
        } else {
          // 登录失败
          console.error('❌ 登录失败:', message);
          showError(
            '<h3 style="margin: 0 0 10px 0;">❌ 登录失败</h3>' +
            '<p><strong>错误代码:</strong> ' + code + '</p>' +
            '<p><strong>错误信息:</strong> ' + message + '</p>'
          );
        }
        
      } catch (error) {
        console.error('❌ 登录异常:', error);
        debugInfo.push('[ERROR] 登录异常:');
        debugInfo.push(JSON.stringify(error, null, 2));
        
        showError(
          '<h3 style="margin: 0 0 10px 0;">❌ 登录异常</h3>' +
          '<p><strong>错误信息:</strong> ' + error.message + '</p>'
        );
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = '登录测试';
        
        // 显示调试信息
        debugDiv.innerHTML = '<h4>📋 调试信息</h4><pre>' + debugInfo.join('\n') + '</pre>';
        debugDiv.style.display = 'block';
      }
    });
    
    // 显示成功消息
    function showSuccess(message) {
      const resultDiv = document.getElementById('result');
      resultDiv.className = 'success';
      resultDiv.innerHTML = message;
    }
    
    // 显示错误消息
    function showError(message) {
      const resultDiv = document.getElementById('result');
      resultDiv.className = 'error';
      resultDiv.innerHTML = '<h3 style="margin: 0 0 10px 0;">❌ 错误</h3><p>' + message + '</p>';
    }
  </script>
</body>
</html>
