<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置管理员密码 - 际华系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo svg {
            width: 64px;
            height: 64px;
            color: #667eea;
        }

        h1 {
            text-align: center;
            color: #1a202c;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }

        .result.success {
            background: #c6f6d5;
            color: #2f855a;
            border: 1px solid #9ae6b4;
            display: block;
        }

        .result.error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #fc8181;
            display: block;
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-message {
            font-size: 14px;
            line-height: 1.5;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-box {
            background: #edf2f7;
            border-left: 4px solid #667eea;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .info-box p {
            color: #4a5568;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
            </svg>
        </div>

        <h1>重置管理员密码</h1>
        <p class="subtitle">际华定制协同办公管理平台</p>

        <div class="info-box">
            <p><strong>注意：</strong>此操作将重置系统管理员账户 (admin) 的密码。如果不填写新密码，将重置为默认密码 <code>admin123</code>。</p>
        </div>

        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">新密码（选填）</label>
                <input 
                    type="password" 
                    id="newPassword" 
                    name="newPassword" 
                    placeholder="留空则使用默认密码 admin123"
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">开始重置密码</span>
            </button>
        </form>

        <div class="result" id="result"></div>
    </div>

    <script>
        const API_URL = 'https://jihua-oa-dev-3goht9irae4d949f-1301818329.ap-shanghai.app.tcloudbase.com/resetAdminPassword';
        
        const form = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const resultDiv = document.getElementById('result');
        const newPasswordInput = document.getElementById('newPassword');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 禁用按钮
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> 正在重置...';
            resultDiv.style.display = 'none';
            resultDiv.className = 'result';

            try {
                const newPassword = newPasswordInput.value.trim() || 'admin123';

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'reset',
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <div class="result-title">✅ 重置成功！</div>
                        <div class="result-message">
                            <p><strong>用户名：</strong>admin</p>
                            <p><strong>新密码：</strong>${data.data.newPassword}</p>
                            <p><strong>重置时间：</strong>${new Date(data.data.resetTime).toLocaleString('zh-CN')}</p>
                            <p style="margin-top: 12px;">请使用新密码登录系统。</p>
                        </div>
                    `;
                } else {
                    throw new Error(data.message || '重置失败');
                }

            } catch (error) {
                console.error('重置密码失败:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <div class="result-title">❌ 重置失败</div>
                    <div class="result-message">
                        <p>${error.message}</p>
                        <p style="margin-top: 8px; font-size: 12px;">
                            错误详情：${error.stack || '未知错误'}
                        </p>
                    </div>
                `;
            } finally {
                // 恢复按钮
                submitBtn.disabled = false;
                btnText.textContent = '开始重置密码';
            }
        });
    </script>
</body>
</html>
