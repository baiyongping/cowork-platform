<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户角色修改工具 - 开发环境</title>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/1.5.0/cloudbase.full.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      color: #f5576c;
      font-size: 28px;
      margin-bottom: 10px;
    }
    .env-badge {
      display: inline-block;
      background: #10b981;
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }
    .warning {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .warning-title {
      color: #92400e;
      font-weight: 600;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .warning-content {
      color: #78350f;
      font-size: 14px;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .label {
      display: block;
      color: #374151;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .input, .select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s;
    }
    .input:focus, .select:focus {
      outline: none;
      border-color: #f5576c;
      box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
    }
    .input:disabled {
      background: #f3f4f6;
      cursor: not-allowed;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }
    .btn-danger {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }
    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
    }
    .btn-secondary {
      background: #6b7280;
      color: white;
    }
    .btn-secondary:hover {
      background: #4b5563;
    }
    .result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }
    .result.success {
      background: #d1fae5;
      border: 2px solid #10b981;
    }
    .result.error {
      background: #fee2e2;
      border: 2px solid #ef4444;
    }
    .result-icon {
      font-size: 48px;
      text-align: center;
      margin-bottom: 15px;
    }
    .result-title {
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 15px;
    }
    .result.success .result-title {
      color: #059669;
    }
    .result.error .result-title {
      color: #dc2626;
    }
    .result-content {
      color: #374151;
      line-height: 1.6;
    }
    .help-text {
      font-size: 13px;
      color: #6b7280;
      margin-top: 5px;
    }
    .loading {
      display: none;
      text-align: center;
      color: #f5576c;
      margin-top: 20px;
    }
    .spinner {
      border: 3px solid #f3f4f6;
      border-top: 3px solid #f5576c;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✏️ 用户角色修改</h1>
      <div class="env-badge">🟢 开发环境</div>
    </div>

    <div class="warning">
      <div class="warning-title">⚠️ 重要提示</div>
      <div class="warning-content">
        此操作将直接修改数据库中的用户角色。<br>
        修改后需要重新登录才能生效。<br>
        请确保您知道自己在做什么！
      </div>
    </div>

    <div class="form-group">
      <label class="label">CloudBase 环境 ID</label>
      <input type="text" id="envId" class="input" value="jihua-oa-dev-3goht9irae4d949f" disabled>
      <div class="help-text">开发环境 ID（已固定）</div>
    </div>

    <div class="form-group">
      <label class="label">用户名 *</label>
      <input type="text" id="username" class="input" placeholder="请输入要修改的用户名" required>
      <div class="help-text">必填，要修改角色的用户名</div>
    </div>

    <div class="form-group">
      <label class="label">新角色 *</label>
      <select id="role" class="select" required>
        <option value="">-- 请选择 --</option>
        <option value="admin">admin（管理员）</option>
        <option value="user">user（普通用户）</option>
      </select>
      <div class="help-text">请选择新的用户角色</div>
    </div>

    <button class="btn btn-danger" onclick="updateRole()">✏️ 修改角色</button>
    <button class="btn btn-secondary" onclick="goBack()">← 返回</button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>正在修改...</div>
    </div>

    <div class="result" id="result"></div>
  </div>

  <script>
    const app = cloudbase.init({
      env: 'jihua-oa-dev-3goht9irae4d949f' // 开发环境（固定）
    });

    const db = app.database();

    async function updateRole() {
      const envId = document.getElementById('envId').value.trim();
      const username = document.getElementById('username').value.trim();
      const newRole = document.getElementById('role').value;
      const loading = document.getElementById('loading');
      const result = document.getElementById('result');

      if (!envId) {
        alert('❌ 请输入环境 ID');
        return;
      }

      if (!username) {
        alert('❌ 请输入用户名');
        return;
      }

      if (!newRole) {
        alert('❌ 请选择新角色');
        return;
      }

      // 二次确认
      if (!confirm(`⚠️ 确认要将用户 "${username}" 的角色修改为 "${newRole}" 吗？\n\n修改后需要重新登录才能生效！`)) {
        return;
      }

      loading.style.display = 'block';
      result.style.display = 'none';

      try {
        // 查询用户
        const { data: users } = await db.collection('users')
          .where({ username })
          .get();

        if (!users || users.length === 0) {
          showResult('error', '❌', '修改失败', `未找到用户 "${username}"`);
          return;
        }

        const user = users[0];

        // 修改角色
        await db.collection('users')
          .doc(user._id)
          .update({
            role: newRole,
            updatedAt: new Date()
          });

        showResult('success', '✅', '修改成功',
          `用户 "${username}" 的角色已修改为 "${newRole}"\n\n` +
          `详细信息：\n` +
          `用户ID: ${user._id}\n` +
          `原角色: ${user.role}\n` +
          `新角色: ${newRole}\n\n` +
          `⚠️ 请重新登录以使更改生效！`
        );
      } catch (error) {
        console.error('修改失败:', error);
        showResult('error', '❌', '修改失败', `错误: ${error.message}`);
      } finally {
        loading.style.display = 'none';
      }
    }

    function showResult(type, icon, title, content) {
      const result = document.getElementById('result');
      result.className = `result ${type}`;
      result.innerHTML = `
        <div class="result-icon">${icon}</div>
        <div class="result-title">${title}</div>
        <div class="result-content">${content.replace(/\n/g, '<br>')}</div>
      `;
      result.style.display = 'block';
    }

    function goBack() {
      window.history.back();
    }

    window.addEventListener('load', () => {
      console.log('🔧 用户角色修改工具已加载（开发环境）');
    });
  </script>
</body>
</html>
