<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创建 Admin 用户 - 开发环境</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    .required {
      color: #dc3545;
      margin-left: 4px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input::placeholder {
      color: #adb5bd;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #result {
      margin-top: 30px;
      padding: 0;
      border-radius: 8px;
    }

    .info-box {
      background: #e7f3ff;
      border: 1px solid #b3d9ff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #004085;
    }

    .info-box ul {
      margin: 10px 0 0 20px;
    }

    .info-box li {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 创建 Admin 用户</h1>
    <p class="subtitle">开发环境 (cowork-9gg9oocb516be5fb)</p>

    <div class="info-box">
      <strong>📌 使用说明：</strong>
      <ul>
        <li>创建系统管理员账号</li>
        <li>拥有所有模块的完整权限</li>
        <li>密码至少 6 位字符</li>
        <li>创建后请牢记密码</li>
      </ul>
    </div>

    <form id="createForm">
      <div class="form-group">
        <label>用户名 <span class="required">*</span></label>
        <input type="text" id="username" value="admin" placeholder="请输入用户名" required>
      </div>

      <div class="form-group">
        <label>密码 <span class="required">*</span></label>
        <input type="password" id="password" placeholder="至少 6 位字符" required>
      </div>

      <div class="form-group">
        <label>确认密码 <span class="required">*</span></label>
        <input type="password" id="confirmPassword" placeholder="再次输入密码" required>
      </div>

      <div class="form-group">
        <label>姓名 <span class="required">*</span></label>
        <input type="text" id="name" value="系统管理员" placeholder="请输入姓名" required>
      </div>

      <div class="form-group">
        <label>邮箱 <span class="required">*</span></label>
        <input type="email" id="email" value="admin@jihua.com" placeholder="请输入邮箱" required>
      </div>

      <button type="submit" id="createButton">创建 Admin 用户</button>
    </form>

    <div id="result"></div>
  </div>

  <!-- 加载 CloudBase SDK -->
  <script src="https://web.sdk.qcloud.com/tcb/latest/tcb.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  
  <script>
    // 等待 SDK 加载完成
    let app, db;
    
    window.addEventListener('load', function() {
      console.log('页面加载完成');
      
      // 检查 CloudBase SDK
      if (typeof cloudbase === 'undefined') {
        console.error('❌ CloudBase SDK 未加载成功');
        document.getElementById('result').innerHTML = `
          <div style="background: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; border-radius: 5px; color: #721c24;">
            <h3 style="margin: 0 0 10px 0;">❌ SDK 加载失败</h3>
            <p style="margin: 5px 0;">CloudBase SDK 加载失败，请检查网络连接或刷新页面重试。</p>
          </div>
        `;
        document.getElementById('createButton').disabled = true;
        return;
      }
      
      console.log('✅ CloudBase SDK 加载成功');
      
      // 初始化 CloudBase
      try {
        app = cloudbase.init({
          env: 'cowork-9gg9oocb516be5fb'
        });
        db = app.database();
        console.log('✅ CloudBase 初始化成功');
      } catch (error) {
        console.error('❌ CloudBase 初始化失败:', error);
        document.getElementById('result').innerHTML = `
          <div style="background: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; border-radius: 5px; color: #721c24;">
            <h3 style="margin: 0 0 10px 0;">❌ 初始化失败</h3>
            <p style="margin: 5px 0;">CloudBase 初始化失败: ${error.message}</p>
          </div>
        `;
        document.getElementById('createButton').disabled = true;
        return;
      }
    });

    // 创建 Admin 用户函数
    async function createAdminUser(event) {
      event.preventDefault();
      
      const createButton = document.getElementById('createButton');
      const resultDiv = document.getElementById('result');
      
      try {
        createButton.disabled = true;
        createButton.textContent = '创建中...';
        resultDiv.innerHTML = '<p style="color: #666; text-align: center;">正在创建 Admin 用户...</p>';

        // 获取表单数据
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();

        // 验证输入
        if (!username || !password || !name || !email) {
          throw new Error('请填写所有必填项');
        }

        if (password !== confirmPassword) {
          throw new Error('两次输入的密码不一致');
        }

        if (password.length < 6) {
          throw new Error('密码长度至少为 6 位');
        }

        // 检查用户名是否已存在
        console.log('检查用户名是否存在...');
        const existingUser = await db.collection('users')
          .where({ username: username })
          .get();

        if (existingUser.data.length > 0) {
          throw new Error(`用户名 "${username}" 已存在`);
        }

        // 加密密码
        console.log('加密密码...');
        const passwordHash = CryptoJS.SHA256(password).toString();

        // 创建用户对象
        const newUser = {
          username: username,
          password: passwordHash,
          name: name,
          email: email,
          department: '管理部门',
          role: 'admin',
          status: 'active',
          permissions: {
            userManagement: true,
            opportunityManagement: true,
            taskManagement: true,
            projectManagement: true,
            goalManagement: true,
            budgetManagement: true,
            issueManagement: true,
            moduleManagement: true,
            safeguardMeasures: true,
            quarterlyMeasures: true,
            meetingManagement: true,
            meetingMinutes: true
          },
          createdAt: new Date(),
          updatedAt: new Date()
        };

        // 添加到数据库
        console.log('添加用户到数据库...');
        const result = await db.collection('users').add(newUser);

        if (result.id) {
          console.log('✅ 用户创建成功:', result.id);
          resultDiv.innerHTML = `
            <div style="background: #d4edda; border: 1px solid #c3e6cb; padding: 15px; border-radius: 8px; color: #155724;">
              <h3 style="margin: 0 0 10px 0;">✅ Admin 用户创建成功！</h3>
              <p style="margin: 5px 0;"><strong>用户名:</strong> ${username}</p>
              <p style="margin: 5px 0;"><strong>姓名:</strong> ${name}</p>
              <p style="margin: 5px 0;"><strong>邮箱:</strong> ${email}</p>
              <p style="margin: 5px 0;"><strong>角色:</strong> 管理员 (admin)</p>
              <p style="margin: 5px 0;"><strong>状态:</strong> 激活</p>
              <p style="margin: 15px 0 5px 0; color: #856404; background: #fff3cd; padding: 10px; border-radius: 3px;">
                ⚠️ <strong>请牢记密码！</strong><br>
                建议现在就测试登录，确保密码正确。
              </p>
            </div>
          `;
          
          // 禁用表单
          document.getElementById('createForm').querySelectorAll('input').forEach(input => {
            input.disabled = true;
          });
        }
      } catch (error) {
        console.error('❌ 创建用户失败:', error);
        resultDiv.innerHTML = `
          <div style="background: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; border-radius: 8px; color: #721c24;">
            <h3 style="margin: 0 0 10px 0;">❌ 创建失败</h3>
            <p style="margin: 5px 0;"><strong>错误信息:</strong> ${error.message}</p>
          </div>
        `;
        createButton.disabled = false;
        createButton.textContent = '创建 Admin 用户';
      }
    }

    // 绑定表单提交事件
    document.getElementById('createForm').addEventListener('submit', createAdminUser);

    // 实时密码匹配检查
    document.getElementById('confirmPassword').addEventListener('input', function() {
      const password = document.getElementById('password').value;
      const confirmPassword = this.value;
      
      if (confirmPassword && password !== confirmPassword) {
        this.style.borderColor = '#dc3545';
      } else {
        this.style.borderColor = '#ced4da';
      }
    });
  </script>
</body>
</html>
