<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置管理员密码 - 际华系统</title>
    <script src="https://web.sdk.qcloud.com/tcb-js-sdk/2.22.0/tcb.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
        }
        .container {
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 600px;
        }
        h1 { font-size: 2.5em; margin: 0 0 20px 0; }
        button {
            margin: 20px 10px;
            padding: 15px 40px;
            font-size: 1.1em;
            background: rgba(76, 175, 80, 0.4);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: rgba(76, 175, 80, 0.6);
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .log {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
        }
        .log p { margin: 5px 0; }
        .success { color: #4caf50; }
        .error { color: #ff5252; }
        .info { color: #2196f3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 重置管理员密码</h1>
        <p>点击下方按钮重置管理员账号</p>
        
        <button id="resetBtn" onclick="resetAdmin()">重置管理员密码</button>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        const SECRET_KEY = 'jihua-oa-platform-secret-key-2025';
        let app, db;
        
        // 初始化CloudBase
        async function initCloudBase() {
            try {
                log('初始化 CloudBase...', 'info');
                
                app = tcb.init({
                    env: 'jihua-8ga4n7aeca09dc4d'
                });
                
                db = app.database();
                
                // 匿名登录
                await app.auth().anonymousAuthProvider().signIn();
                log('✅ CloudBase 初始化成功', 'success');
                
                return true;
            } catch (error) {
                log('❌ CloudBase 初始化失败: ' + error.message, 'error');
                return false;
            }
        }
        
        // 密码哈希函数（与前端保持一致）
        async function hashPassword(password) {
            // 使用 JS 实现确保一致性
            return sha256JS(password + SECRET_KEY);
        }
        
        // JS 实现的 SHA-256
        function sha256JS(message) {
            function rightRotate(value, amount) {
                return (value >>> amount) | (value << (32 - amount));
            }
            
            const K = [
                0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
                0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
                0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
                0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
                0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
                0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
                0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
                0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
            ];
            
            const bytes = new TextEncoder().encode(message);
            const bitLength = bytes.length * 8;
            const paddedLength = Math.ceil((bitLength + 65) / 512) * 64;
            const padded = new Uint8Array(paddedLength);
            padded.set(bytes);
            padded[bytes.length] = 0x80;
            
            const view = new DataView(padded.buffer);
            view.setUint32(paddedLength - 4, bitLength, false);
            
            let H = [
                0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
                0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
            ];
            
            for (let chunk = 0; chunk < paddedLength; chunk += 64) {
                const W = new Array(64);
                for (let t = 0; t < 16; t++) {
                    W[t] = view.getUint32(chunk + t * 4, false);
                }
                for (let t = 16; t < 64; t++) {
                    const s0 = rightRotate(W[t-15], 7) ^ rightRotate(W[t-15], 18) ^ (W[t-15] >>> 3);
                    const s1 = rightRotate(W[t-2], 17) ^ rightRotate(W[t-2], 19) ^ (W[t-2] >>> 10);
                    W[t] = (W[t-16] + s0 + W[t-7] + s1) | 0;
                }
                
                let [a, b, c, d, e, f, g, h] = H;
                
                for (let t = 0; t < 64; t++) {
                    const S1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
                    const ch = (e & f) ^ (~e & g);
                    const temp1 = (h + S1 + ch + K[t] + W[t]) | 0;
                    const S0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
                    const maj = (a & b) ^ (a & c) ^ (b & c);
                    const temp2 = (S0 + maj) | 0;
                    
                    h = g;
                    g = f;
                    f = e;
                    e = (d + temp1) | 0;
                    d = c;
                    c = b;
                    b = a;
                    a = (temp1 + temp2) | 0;
                }
                
                H[0] = (H[0] + a) | 0;
                H[1] = (H[1] + b) | 0;
                H[2] = (H[2] + c) | 0;
                H[3] = (H[3] + d) | 0;
                H[4] = (H[4] + e) | 0;
                H[5] = (H[5] + f) | 0;
                H[6] = (H[6] + g) | 0;
                H[7] = (H[7] + h) | 0;
            }
            
            return H.map(h => h.toString(16).padStart(8, '0')).join('');
        }
        
        // 重置管理员
        async function resetAdmin() {
            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            clearLog();
            
            try {
                // 初始化
                if (!db) {
                    const success = await initCloudBase();
                    if (!success) {
                        btn.disabled = false;
                        return;
                    }
                }
                
                log('开始重置管理员账号...', 'info');
                
                // 生成新密码哈希
                const password = 'admin123';
                const hashedPassword = await hashPassword(password);
                log('密码哈希: ' + hashedPassword.substring(0, 20) + '...', 'info');
                
                // 查找管理员
                const result = await db.collection('users').where({
                    username: 'admin'
                }).get();
                
                if (result.data.length === 0) {
                    log('❌ 未找到管理员账号', 'error');
                    btn.disabled = false;
                    return;
                }
                
                const adminId = result.data[0]._id;
                log('找到管理员账号 ID: ' + adminId, 'success');
                
                // 更新密码
                await db.collection('users').doc(adminId).update({
                    password: hashedPassword,
                    updatedAt: new Date()
                });
                
                log('✅ 管理员密码重置成功！', 'success');
                log('', 'info');
                log('登录信息：', 'info');
                log('用户名: admin', 'info');
                log('密码: admin123', 'info');
                log('', 'info');
                log('请返回登录页面使用新密码登录', 'success');
                
            } catch (error) {
                log('❌ 重置失败: ' + error.message, 'error');
                console.error('详细错误:', error);
            }
            
            btn.disabled = false;
        }
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const p = document.createElement('p');
            p.className = type;
            p.textContent = message || '​';
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        // 页面加载时初始化
        window.onload = () => {
            log('🔧 管理员密码重置工具已就绪', 'success');
            log('点击按钮开始重置...', 'info');
        };
    </script>
</body>
</html>
