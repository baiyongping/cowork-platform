<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>baiyp02 权限快速修复</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #667eea;
      text-align: center;
      margin-bottom: 10px;
      font-size: 32px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }
    .alert {
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      font-size: 16px;
      line-height: 1.6;
    }
    .alert-info { background: #d1ecf1; color: #0c5460; border-left: 5px solid #17a2b8; }
    .alert-warning { background: #fff3cd; color: #856404; border-left: 5px solid #ffc107; }
    .alert-success { background: #d4edda; color: #155724; border-left: 5px solid #28a745; }
    .alert-error { background: #f8d7da; color: #721c24; border-left: 5px solid #dc3545; }
    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 15px 0;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }
    .btn-danger {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }
    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }
    #result {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      min-height: 100px;
      display: none;
    }
    #result.show { display: block; }
    pre {
      background: #282c34;
      color: #abb2bf;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 14px;
      line-height: 1.6;
    }
    .code-line { margin: 8px 0; }
    .key { color: #e06c75; }
    .value { color: #98c379; }
    .null { color: #d19a66; }
    .steps {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 8px;
      margin: 25px 0;
    }
    .step {
      margin: 15px 0;
      padding-left: 35px;
      position: relative;
    }
    .step::before {
      content: attr(data-step);
      position: absolute;
      left: 0;
      top: 0;
      background: #667eea;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      text-align: center;
      line-height: 28px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 baiyp02 权限修复工具</h1>
    <p class="subtitle">一键诊断并修复权限问题</p>

    <div class="alert alert-info">
      <strong>📌 使用说明：</strong><br>
      1️⃣ 确保你已经在系统中<strong>登录</strong><br>
      2️⃣ 点击"立即诊断"检查当前权限状态<br>
      3️⃣ 如果提示有问题，点击"清除缓存并重新登录"
    </div>

    <button class="btn btn-primary" onclick="diagnose()">🔍 立即诊断权限问题</button>
    <button class="btn btn-danger" onclick="fixNow()" style="display:none;" id="fixBtn">⚡ 清除缓存并重新登录</button>

    <div id="result"></div>

    <div class="steps">
      <h3 style="margin-top:0;">📋 完整修复步骤</h3>
      <div class="step" data-step="1">
        <strong>点击"立即诊断"</strong> - 检查当前用户数据
      </div>
      <div class="step" data-step="2">
        <strong>查看诊断结果</strong> - 确认是否缺少 roles 字段
      </div>
      <div class="step" data-step="3">
        <strong>点击"清除缓存并重新登录"</strong> - 清除旧数据
      </div>
      <div class="step" data-step="4">
        <strong>重新登录</strong> - 使用 baiyp02 账号登录
      </div>
      <div class="step" data-step="5">
        <strong>验证修复</strong> - 检查是否能看到"系统设置"等功能
      </div>
    </div>
  </div>

  <script>
    function diagnose() {
      const resultDiv = document.getElementById('result');
      const fixBtn = document.getElementById('fixBtn');
      resultDiv.classList.add('show');
      
      try {
        const userStr = localStorage.getItem('current_user');
        const token = localStorage.getItem('auth_token');
        
        console.log('📊 开始诊断...');
        console.log('Token 存在:', !!token);
        console.log('User 数据存在:', !!userStr);
        
        if (!userStr || !token) {
          resultDiv.innerHTML = `
            <div class="alert alert-error">
              <strong>❌ 诊断结果：未登录</strong><br><br>
              未找到登录信息，请先在系统中登录，然后再打开此页面进行诊断。
            </div>
          `;
          fixBtn.style.display = 'none';
          return;
        }
        
        const user = JSON.parse(userStr);
        console.log('👤 用户数据:', user);
        
        const hasRoles = Array.isArray(user.roles) && user.roles.length > 0;
        const isExecutive = hasRoles && user.roles.includes('executive');
        
        let diagnosis = '';
        let needsFix = false;
        
        if (!hasRoles) {
          diagnosis = `
            <div class="alert alert-error">
              <strong>❌ 诊断结果：权限数据缺失</strong><br><br>
              <strong>问题：</strong>用户数据中缺少 <code>roles</code> 字段或为空<br>
              <strong>影响：</strong>无法获取角色权限，导致功能无法显示<br>
              <strong>解决：</strong>需要清除缓存并重新登录
            </div>
          `;
          needsFix = true;
        } else if (!isExecutive) {
          diagnosis = `
            <div class="alert alert-warning">
              <strong>⚠️ 诊断结果：角色数据不匹配</strong><br><br>
              <strong>当前角色：</strong>${JSON.stringify(user.roles)}<br>
              <strong>预期角色：</strong>["executive"] (公司高管)<br>
              <strong>解决：</strong>需要清除缓存并重新登录
            </div>
          `;
          needsFix = true;
        } else {
          diagnosis = `
            <div class="alert alert-success">
              <strong>✅ 诊断结果：权限数据正常</strong><br><br>
              用户 <strong>${user.name}</strong> (${user.username}) 的角色配置正确：<br>
              - roles: ${JSON.stringify(user.roles)} ✅<br>
              - 应该能看到：系统设置、员工管理、操作日志等功能<br><br>
              <strong>如果仍然看不到功能，请：</strong><br>
              1. 强制刷新页面 (Ctrl+F5 或 Cmd+Shift+R)<br>
              2. 检查浏览器控制台的权限日志<br>
              3. 联系管理员检查角色权限配置
            </div>
          `;
          needsFix = false;
        }
        
        resultDiv.innerHTML = `
          ${diagnosis}
          <h3 style="margin-top:25px;">📄 完整用户数据：</h3>
          <pre>${JSON.stringify(user, null, 2)}</pre>
        `;
        
        fixBtn.style.display = needsFix ? 'block' : 'none';
        console.log('✅ 诊断完成，需要修复:', needsFix);
        
      } catch (error) {
        console.error('❌ 诊断失败:', error);
        resultDiv.innerHTML = `
          <div class="alert alert-error">
            <strong>❌ 诊断失败</strong><br><br>
            错误信息: ${error.message}<br>
            <pre>${error.stack}</pre>
          </div>
        `;
        fixBtn.style.display = 'none';
      }
    }
    
    function fixNow() {
      if (!confirm('⚠️ 确定要清除缓存吗？\n\n这将：\n✅ 清除您的登录状态\n✅ 清除旧的用户数据\n❌ 需要重新登录\n\n点击"确定"继续')) {
        return;
      }
      
      try {
        console.log('🧹 开始清除缓存...');
        localStorage.removeItem('auth_token');
        localStorage.removeItem('current_user');
        console.log('✅ 缓存已清除');
        
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `
          <div class="alert alert-success">
            <strong>✅ 缓存已清除！</strong><br><br>
            页面即将跳转到登录页面...<br>
            请使用 <strong>baiyp02</strong> 账号重新登录。
          </div>
        `;
        
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
        
      } catch (error) {
        console.error('❌ 清除失败:', error);
        alert('❌ 清除缓存失败: ' + error.message);
      }
    }
    
    // 页面加载时显示提示
    console.log('🔧 baiyp02 权限修复工具已就绪');
    console.log('💡 点击 "立即诊断权限问题" 开始检查');
  </script>
</body>
</html>
