<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除 CloudBase 登录态</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 32px;
        }
        
        .info {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
            border-radius: 8px;
        }
        
        .info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .info p {
            color: #666;
            line-height: 1.6;
            margin: 5px 0;
        }
        
        .button-group {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .status {
            margin-top: 30px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .log {
            background: #2d3748;
            color: #63b3ed;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .log-item {
            margin: 5px 0;
            padding: 5px 0;
            border-bottom: 1px solid #4a5568;
        }
        
        .log-item:last-child {
            border-bottom: none;
        }
        
        .log-time {
            color: #cbd5e0;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 清除 CloudBase 登录态</h1>
        
        <div class="info">
            <h3>❓ 为什么需要清除？</h3>
            <p><strong>问题:</strong> 之前的微信登录在 CloudBase 留下了登录态，导致用户名密码登录被阻塞。</p>
            <p><strong>解决:</strong> 清除所有 CloudBase 相关的登录态和缓存数据。</p>
        </div>
        
        <div class="info">
            <h3>📝 将要清除的内容：</h3>
            <p>✅ CloudBase 登录态 (localStorage)</p>
            <p>✅ 微信回调检查标记 (sessionStorage)</p>
            <p>✅ 浏览器缓存</p>
            <p>✅ Cookies (cloudbase 相关)</p>
        </div>
        
        <div class="button-group">
            <button class="btn btn-primary" onclick="clearCloudBaseAuth()">🗑️ 清除登录态</button>
            <a href="https://152.136.183.181:8010" class="btn btn-secondary">🏠 返回登录页</a>
        </div>
        
        <div id="status"></div>
        <div id="log" class="log" style="display: none;"></div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');
        
        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString('zh-CN');
            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            
            let icon = '📝';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '❌';
            if (type === 'warning') icon = '⚠️';
            
            logItem.innerHTML = `<span class="log-time">[${time}]</span> ${icon} ${message}`;
            logDiv.appendChild(logItem);
            logDiv.style.display = 'block';
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        async function clearCloudBaseAuth() {
            addLog('开始清除 CloudBase 登录态...', 'info');
            
            try {
                // 1. 清除 localStorage
                addLog('正在清除 localStorage...', 'info');
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && (
                        key.includes('cloudbase') || 
                        key.includes('tcb') || 
                        key.includes('wechat') ||
                        key.includes('wx') ||
                        key.includes('auth')
                    )) {
                        keysToRemove.push(key);
                    }
                }
                
                keysToRemove.forEach(key => {
                    localStorage.removeItem(key);
                    addLog(`移除 localStorage: ${key}`, 'success');
                });
                
                if (keysToRemove.length === 0) {
                    addLog('localStorage 中没有找到相关数据', 'warning');
                }
                
                // 2. 清除 sessionStorage
                addLog('正在清除 sessionStorage...', 'info');
                const sessionKeysToRemove = [];
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    if (key && (
                        key.includes('cloudbase') || 
                        key.includes('tcb') || 
                        key.includes('wechat') ||
                        key.includes('wx') ||
                        key.includes('auth')
                    )) {
                        sessionKeysToRemove.push(key);
                    }
                }
                
                sessionKeysToRemove.forEach(key => {
                    sessionStorage.removeItem(key);
                    addLog(`移除 sessionStorage: ${key}`, 'success');
                });
                
                if (sessionKeysToRemove.length === 0) {
                    addLog('sessionStorage 中没有找到相关数据', 'warning');
                }
                
                // 3. 清除微信回调检查标记
                addLog('正在清除微信回调检查标记...', 'info');
                sessionStorage.removeItem('wechat-callback-checked');
                addLog('移除微信回调检查标记', 'success');
                
                // 4. 尝试清除 Cookies
                addLog('正在清除 Cookies...', 'info');
                const cookies = document.cookie.split(';');
                let cookieCount = 0;
                
                cookies.forEach(cookie => {
                    const [name] = cookie.split('=');
                    const cookieName = name.trim();
                    if (cookieName.includes('cloudbase') || 
                        cookieName.includes('tcb') || 
                        cookieName.includes('wechat') ||
                        cookieName.includes('wx')) {
                        document.cookie = `${cookieName}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
                        addLog(`移除 Cookie: ${cookieName}`, 'success');
                        cookieCount++;
                    }
                });
                
                if (cookieCount === 0) {
                    addLog('Cookies 中没有找到相关数据', 'warning');
                }
                
                // 完成
                addLog('🎉 所有 CloudBase 登录态已清除！', 'success');
                
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `
                    <strong>✅ 清除完成！</strong><br>
                    <br>
                    <strong>清除统计：</strong><br>
                    - localStorage: ${keysToRemove.length} 项<br>
                    - sessionStorage: ${sessionKeysToRemove.length} 项<br>
                    - Cookies: ${cookieCount} 项<br>
                    <br>
                    <strong>下一步操作：</strong><br>
                    1. 点击下方"返回登录页"按钮<br>
                    2. 按 <strong>Ctrl + F5</strong> 强制刷新<br>
                    3. 输入用户名密码登录<br>
                `;
                
                // 3秒后自动跳转
                addLog('3秒后自动跳转到登录页...', 'info');
                setTimeout(() => {
                    window.location.href = 'https://152.136.183.181:8010';
                }, 3000);
                
            } catch (error) {
                addLog('清除过程出错: ' + error.message, 'error');
                
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `
                    <strong>❌ 清除失败</strong><br>
                    错误信息: ${error.message}<br>
                    <br>
                    请手动清除浏览器缓存后重试。
                `;
            }
        }
        
        // 页面加载时显示当前登录态信息
        window.addEventListener('load', () => {
            addLog('页面加载完成', 'success');
            
            // 检查当前登录态
            let hasLoginState = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.includes('cloudbase') || key.includes('tcb') || key.includes('wechat'))) {
                    hasLoginState = true;
                    addLog(`发现登录态: ${key}`, 'warning');
                }
            }
            
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key && (key.includes('cloudbase') || key.includes('tcb') || key.includes('wechat'))) {
                    hasLoginState = true;
                    addLog(`发现会话数据: ${key}`, 'warning');
                }
            }
            
            if (!hasLoginState) {
                addLog('当前没有检测到 CloudBase 登录态', 'info');
            }
        });
    </script>
</body>
</html>
