<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据库查询工具</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { color: #333; margin-bottom: 10px; }
    .btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      transition: all 0.3s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #result {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      min-height: 100px;
    }
    .user-card {
      background: white;
      padding: 16px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 8px;
    }
    .pending { background: #fff3cd; color: #856404; }
    .approved { background: #d4edda; color: #155724; }
    .rejected { background: #f8d7da; color: #721c24; }
    .success { color: #28a745; font-weight: bold; }
    .error { color: #dc3545; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 数据库查询工具</h1>
    <p style="color: #666; margin-bottom: 20px;">直接查询CloudBase数据库用户数据</p>
    
    <button id="btn" class="btn">🚀 开始查询</button>
    
    <div id="result">
      <p style="color: #999;">点击按钮开始查询...</p>
    </div>
  </div>

  <script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/2.0.1/cloudbase.full.js"></script>
  
  <script>
    (function() {
      let app, db, inited = false;
      
      async function init() {
        if (inited) return true;
        try {
          const CB = window.cloudbase || window.tcb;
          if (!CB) throw new Error('SDK未加载');
          app = CB.init({ env: 'prod-4gnmm3ni0dc5c4e9' });
          await app.auth().anonymousAuthProvider().signIn();
          db = app.database();
          inited = true;
          console.log('✅ 初始化成功');
          return true;
        } catch (e) {
          console.error('❌ 初始化失败:', e);
          show('<p class="error">初始化失败: ' + e.message + '</p>');
          return false;
        }
      }
      
      function show(html) {
        document.getElementById('result').innerHTML = html;
      }
      
      async function query() {
        const btn = document.getElementById('btn');
        btn.disabled = true;
        btn.textContent = '⏳ 查询中...';
        
        show('<p style="color: #667eea;">正在查询...</p>');
        
        if (!await init()) {
          btn.disabled = false;
          btn.textContent = '🚀 开始查询';
          return;
        }
        
        try {
          const res = await db.collection('users').get();
          console.log('查询结果:', res);
          
          if (!res.data || res.data.length === 0) {
            show('<p class="error">❌ 数据库中没有用户</p>');
            btn.disabled = false;
            btn.textContent = '🚀 开始查询';
            return;
          }
          
          const total = res.data.length;
          const pending = res.data.filter(u => u.approvalStatus === 'pending').length;
          const approved = res.data.filter(u => u.approvalStatus === 'approved').length;
          
          let html = `<p class="success">✅ 找到 ${total} 个用户</p>`;
          html += `<p style="margin: 10px 0;"><strong>待审核: ${pending}</strong> | 已审核: ${approved}</p><hr style="margin: 20px 0;">`;
          
          res.data.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
          
          res.data.forEach((u, i) => {
            const st = u.approvalStatus === 'approved' ? 'approved' : 
                      u.approvalStatus === 'rejected' ? 'rejected' : 'pending';
            const txt = u.approvalStatus === 'approved' ? '已审核' : 
                       u.approvalStatus === 'rejected' ? '已拒绝' : '待审核';
            html += `
              <div class="user-card">
                <h3>${i + 1}. ${u.name || u.username} <span class="badge ${st}">${txt}</span></h3>
                <p><strong>用户名:</strong> ${u.username}</p>
                <p><strong>手机:</strong> ${u.phone}</p>
                <p><strong>状态:</strong> "${u.approvalStatus}" (${typeof u.approvalStatus})</p>
                <p><strong>创建:</strong> ${u.createdAt}</p>
              </div>
            `;
          });
          
          console.log('待审核用户数:', pending);
          console.log('所有用户:', res.data);
          
          show(html);
        } catch (e) {
          console.error('查询失败:', e);
          show('<p class="error">❌ 查询失败: ' + e.message + '</p>');
        } finally {
          btn.disabled = false;
          btn.textContent = '🚀 开始查询';
        }
      }
      
      document.getElementById('btn').onclick = query;
    })();
  </script>
</body>
</html>
