<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudBase 数字保存测试</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: linear-gradient(135deg, #e0f2fe, #eff6ff);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      padding: 24px 24px 20px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 20px;
    }
    .form-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .form-row label {
      font-size: 14px;
      color: #374151;
      min-width: 70px;
    }
    .number-input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      font-size: 14px;
      outline: none;
      transition: all 0.15s ease;
    }
    .number-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.3);
    }
    .button {
      padding: 9px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.1s ease;
    }
    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.5);
    }
    .button:active {
      transform: translateY(0);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.4);
    }
    .button[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .status {
      font-size: 13px;
      margin-bottom: 10px;
      min-height: 18px;
    }
    .status.info { color: #4b5563; }
    .status.success { color: #15803d; }
    .status.error { color: #b91c1c; }
    .current-value {
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #111827;
      margin-bottom: 8px;
    }
    .current-value span.value {
      font-weight: 600;
      color: #2563eb;
    }
    .footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #9ca3af;
      font-size: 11px;
    }
    .footer .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      margin-right: 4px;
    }
    .footer .dot.ok { background: #22c55e; }
    .footer .dot.err { background: #ef4444; }
  </style>
  <!-- 使用 CloudBase JS SDK UMD 版本 -->
  <script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/2.0.1/cloudbase.full.js"></script>
</head>
<body>
  <div class="card">
    <div class="title">
      <span>CloudBase 数字保存测试</span>
    </div>
    <div class="subtitle">在 Lighthouse 上运行：输入一个数字，保存到 CloudBase，下次访问会自动读出来。</div>

    <div id="currentValue" class="current-value" style="display:none;"></div>

    <div class="form-row">
      <label for="numberInput">测试数值</label>
      <input id="numberInput" class="number-input" type="number" placeholder="请输入数字" />
      <button id="saveBtn" class="button">
        <span>保存</span>
      </button>
    </div>

    <div id="status" class="status info"></div>

    <div class="footer">
      <div style="display:flex;align-items:center;">
        <span id="connDot" class="dot"></span>
        <span id="connText">正在初始化...</span>
      </div>
      <span style="font-family: monospace;font-size:11px;">env: jihua-oa-dev</span>
    </div>
  </div>

  <script>
    const ENV_ID = 'jihua-oa-dev-3goht9irae4d949f';
    const COLLECTION = 'testSettings';
    const DOC_ID = 'global-number';

    let app = null;
    let db = null;
    let auth = null;

    const statusEl = document.getElementById('status');
    const currentValueEl = document.getElementById('currentValue');
    const numberInputEl = document.getElementById('numberInput');
    const saveBtn = document.getElementById('saveBtn');
    const connDot = document.getElementById('connDot');
    const connText = document.getElementById('connText');

    function setStatus(message, type = 'info') {
      statusEl.textContent = message || '';
      statusEl.className = 'status ' + type;
    }

    function setConnection(ok, message) {
      connDot.className = 'dot ' + (ok ? 'ok' : 'err');
      connText.textContent = message;
    }

    async function initCloudBase() {
      try {
        if (typeof cloudbase === 'undefined') {
          throw new Error('CloudBase SDK 未加载');
        }

        setStatus('正在初始化 CloudBase...', 'info');
        setConnection(false, '初始化中...');

        app = cloudbase.init({ env: ENV_ID });
        auth = app.auth();
        db = app.database();

        // 匿名登录，确保有凭证
        const loginState = await auth.getLoginState();
        if (!loginState) {
          await auth.signInAnonymously();
        }

        setConnection(true, 'CloudBase 已连接');
        setStatus('初始化完成，正在读取已保存的数值...', 'info');

        await loadNumber();
      } catch (error) {
        console.error('初始化失败:', error);
        setConnection(false, '初始化失败');
        setStatus('初始化失败: ' + (error.message || error.errMsg || '未知错误'), 'error');
        saveBtn.disabled = true;
      }
    }

    async function loadNumber() {
      try {
        const res = await db.collection(COLLECTION).doc(DOC_ID).get();
        const dataArray = Array.isArray(res) ? res : (res.data || []);
        const doc = dataArray[0];

        if (doc && typeof doc.value === 'number') {
          numberInputEl.value = doc.value;
          currentValueEl.style.display = 'block';
          currentValueEl.innerHTML = '当前已保存的数值：<span class="value">' + doc.value + '</span>';
          setStatus('已从 CloudBase 读取保存的数值。', 'success');
        } else {
          currentValueEl.style.display = 'none';
          setStatus('还没有保存过数值，请输入后点击保存。', 'info');
        }
      } catch (error) {
        console.error('读取失败:', error);
        setStatus('读取失败: ' + (error.message || error.errMsg || '未知错误'), 'error');
      }
    }

    async function saveNumber() {
      const raw = numberInputEl.value.trim();
      if (!raw) {
        setStatus('请输入要保存的数字。', 'error');
        return;
      }

      const value = Number(raw);
      if (Number.isNaN(value)) {
        setStatus('请输入有效的数字。', 'error');
        return;
      }

      if (!db) {
        setStatus('CloudBase 未初始化，请稍候刷新页面重试。', 'error');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = '保存中...';
      setStatus('正在保存到 CloudBase...', 'info');

      try {
        await db.collection(COLLECTION).doc(DOC_ID).set({
          value,
          updatedAt: new Date()
        });

        currentValueEl.style.display = 'block';
        currentValueEl.innerHTML = '当前已保存的数值：<span class="value">' + value + '</span>';
        setStatus('保存成功！下次访问时会自动读取该数值。', 'success');
      } catch (error) {
        console.error('保存失败:', error);
        setStatus('保存失败: ' + (error.message || error.errMsg || '未知错误'), 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '保存';
      }
    }

    saveBtn.addEventListener('click', () => {
      saveNumber();
    });

    numberInputEl.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') {
        saveNumber();
      }
    });

    window.addEventListener('load', () => {
      setStatus('页面加载完成，开始初始化 CloudBase...', 'info');
      initCloudBase();
    });
  </script>
</body>
</html>
